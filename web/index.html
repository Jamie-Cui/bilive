<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bilive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </div>
            <h1>bilive</h1>
          </div>
          <button class="sidebar-close" id="sidebar-close" type="button" aria-label="关闭菜单">&times;</button>
        </div>

        <nav class="nav-tabs" aria-label="后台导航">
          <button class="active" data-tab="account" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            账号
          </button>
          <button data-tab="stream" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            直播
          </button>
          <button data-tab="comments" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            弹幕
          </button>
          <button data-tab="manager" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            管理
          </button>
        </nav>

        <div class="status-strip">
          <div class="status-dot ok" id="service-status" data-label="服务">
            <span class="dot"></span><span class="status-text">运行中</span>
          </div>
          <div class="status-dot" id="auth-status" data-label="账号">
            <span class="dot"></span><span class="status-text">未登录</span>
          </div>
          <div class="status-dot" id="danmu-status" data-label="弹幕">
            <span class="dot"></span><span class="status-text">未连接</span>
          </div>
        </div>
        <div class="sidebar-footer">
          <div class="theme-switch" aria-label="主题切换">
            <button id="theme-light" data-theme-value="light" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <button id="theme-dark" data-theme-value="dark" type="button" class="active">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </div>
          <span class="config-path" id="config-path">加载配置中</span>
        </div>
      </aside>

      <div class="workspace-wrapper">
        <header class="topbar">
          <div class="topbar-left">
            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开菜单">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h2 id="page-title">账号</h2>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-ghost" id="refresh" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              刷新
            </button>
            <button class="btn btn-danger" id="logout" type="button" disabled>退出登录</button>
          </div>
        </header>

        <section class="workspace">
          <!-- Account Tab -->
          <section class="tab-panel active" id="tab-account">
            <div class="two-column">
              <section class="card">
                <h3>扫码登录</h3>
                <div class="qr-box" id="qr-box">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.3"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><line x1="21" y1="14" x2="21" y2="14.01"/><line x1="21" y1="21" x2="21" y2="21.01"/></svg>
                  <span>点击下方按钮生成</span>
                </div>
                <div class="btn-row">
                  <button class="btn btn-primary" id="qr-generate" type="button">生成二维码</button>
                  <button class="btn btn-ghost" id="qr-stop" type="button" disabled>停止轮询</button>
                </div>
                <p class="hint" id="qr-status">使用哔哩哔哩 App 扫码确认后会自动初始化。</p>
              </section>

              <section class="card">
                <h3>Cookie 登录</h3>
                <label>
                  <span class="label-text">Session Cookie</span>
                  <textarea id="cookie-input" rows="7" placeholder="粘贴包含 SESSDATA 和 bili_jct 的 Cookie"></textarea>
                </label>
                <button class="btn btn-primary" id="cookie-login" type="button">验证并登录</button>
                <p class="hint">Cookie 只写入本机配置文件，不会显示在页面响应中。</p>
              </section>
            </div>

            <section class="card">
              <h3>账号信息</h3>
              <div class="profile" id="profile">
                <span class="profile-empty">未登录</span>
              </div>
            </section>
          </section>
          <!-- Stream Tab -->
          <section class="tab-panel" id="tab-stream">
            <section class="card">
              <h3>直播间设置</h3>
              <div class="form-grid">
                <label>
                  <span class="label-text">标题</span>
                  <input id="room-title" placeholder="直播间标题" />
                </label>
                <label>
                  <span class="label-text">父分区</span>
                  <select id="category-id"></select>
                </label>
                <label>
                  <span class="label-text">子分区</span>
                  <select id="area-id"></select>
                </label>
              </div>
              <div class="btn-row">
                <button class="btn btn-live" id="start-live" type="button">
                  <span class="live-dot"></span>开始直播
                </button>
                <button class="btn btn-danger" id="stop-live" type="button">停止直播</button>
                <span class="btn-separator"></span>
                <button class="btn btn-ghost btn-sm" id="save-title" type="button">更新标题</button>
                <button class="btn btn-ghost btn-sm" id="save-area" type="button">更新分区</button>
                <button class="btn btn-ghost btn-sm" id="bootstrap" type="button">重新初始化</button>
              </div>
            </section>

            <section class="card">
              <div class="card-header">
                <h3>推流凭证</h3>
                <button class="btn btn-ghost btn-sm" id="toggle-stream-credentials" type="button">显示</button>
              </div>
              <div class="stream-list" id="stream-list">暂无推流凭证</div>
            </section>
            <section class="event-feed live-console" aria-label="直播控制台">
              <div class="feed-header">
                <h3>控制台</h3>
                <button class="btn btn-ghost btn-sm" id="clear-live-console" type="button">清空</button>
              </div>
              <div class="console-body">
                <div class="face-auth-panel" id="face-auth-panel" hidden>
                  <div class="qr-box face-auth-qr" id="face-auth-qr">未生成</div>
                  <div class="face-auth-copy">
                    <strong>开播身份验证</strong>
                    <p class="hint" id="face-auth-status">等待开播返回</p>
                    <a class="console-link" id="face-auth-link" target="_blank" rel="noreferrer" hidden>打开验证页面</a>
                  </div>
                </div>
                <pre class="raw-output" id="live-console-output">暂无数据</pre>
              </div>
            </section>
          </section>

          <!-- Comments Tab -->
          <section class="tab-panel" id="tab-comments">
            <div class="danmu-top-row">
              <section class="card danmu-connect-card collapsed">
                <div class="card-header" data-collapse="danmu-settings">
                  <h3>弹幕连接</h3>
                  <button class="btn btn-ghost btn-sm" type="button">
                    <svg class="collapse-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                  </button>
                </div>
                <div class="danmu-quick-row">
                  <label class="inline-label">
                    <span class="label-text">房间 ID</span>
                    <input id="room-id" inputmode="numeric" placeholder="房间号" />
                  </label>
                  <button class="btn btn-primary" id="connect-danmu" type="button">连接</button>
                  <button class="btn btn-danger" id="disconnect-danmu" type="button">断开</button>
                </div>
                <div class="collapse-body" id="danmu-settings-body">
                  <div class="form-grid form-grid-4">
                    <label>
                      <span class="label-text">UID</span>
                      <input id="uid" inputmode="numeric" />
                    </label>
                    <label>
                      <span class="label-text">Host</span>
                      <input id="host" value="broadcastlv.chat.bilibili.com" />
                    </label>
                    <label>
                      <span class="label-text">Port</span>
                      <input id="port" inputmode="numeric" value="2243" />
                    </label>
                  </div>
                  <button class="btn btn-ghost btn-sm" id="refresh-danmu-token" type="button">刷新弹幕 Token</button>
                </div>
              </section>
              <section class="card send-card">
                <div class="inline-form">
                  <input id="comment-message" placeholder="输入弹幕内容，回车发送" />
                  <button class="btn btn-primary" id="send-comment" type="button">发送</button>
                </div>
              </section>
            </div>

            <section class="event-feed" aria-label="事件流">
              <div class="feed-header">
                <h3>事件流</h3>
                <div class="btn-row">
                  <button class="btn btn-ghost btn-sm" id="load-rank" type="button">在线榜单</button>
                  <button class="btn btn-ghost btn-sm" id="clear-logs" type="button">清空</button>
                </div>
              </div>
              <div class="log-list" id="log-list">
                <div class="empty-state">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  <span>暂无事件</span>
                </div>
              </div>
            </section>
          </section>

          <!-- Manager Tab -->
          <section class="tab-panel" id="tab-manager">
            <div class="two-column">
              <section class="card">
                <h3>房管</h3>
                <div class="inline-form">
                  <input id="admin-uid" placeholder="UID" />
                  <button class="btn btn-primary btn-sm" id="add-admin" type="button">添加</button>
                  <button class="btn btn-danger btn-sm" id="delete-admin" type="button">移除</button>
                </div>
                <button class="btn btn-ghost btn-sm" id="load-admins" type="button">加载房管列表</button>
              </section>

              <section class="card">
                <h3>用户禁言</h3>
                <div class="inline-form">
                  <input id="silent-uid" placeholder="UID" />
                  <input id="silent-hour" placeholder="小时" value="1" class="input-sm" />
                  <button class="btn btn-primary btn-sm" id="add-silent" type="button">禁言</button>
                  <button class="btn btn-danger btn-sm" id="delete-silent" type="button">解除</button>
                </div>
                <div class="inline-form">
                  <input id="search-user" placeholder="搜索昵称或 UID" />
                  <button class="btn btn-ghost btn-sm" id="search-user-button" type="button">搜索</button>
                </div>
                <button class="btn btn-ghost btn-sm" id="load-silent" type="button">加载禁言列表</button>
              </section>
              <section class="card">
                <h3>全局禁言</h3>
                <div class="form-grid form-grid-3">
                  <label>
                    <span class="label-text">类型</span>
                    <select id="room-silent-type">
                      <option value="off">关闭</option>
                      <option value="wealth">财富等级</option>
                      <option value="medal">粉丝勋章</option>
                      <option value="member">正式会员</option>
                    </select>
                  </label>
                  <label>
                    <span class="label-text">等级</span>
                    <input id="room-silent-level" inputmode="numeric" value="1" />
                  </label>
                  <label>
                    <span class="label-text">分钟</span>
                    <input id="room-silent-minute" inputmode="numeric" value="0" />
                  </label>
                </div>
                <div class="btn-row">
                  <button class="btn btn-primary btn-sm" id="set-room-silent" type="button">设置</button>
                  <button class="btn btn-ghost btn-sm" id="load-room-silent" type="button">读取</button>
                </div>
              </section>

              <section class="card">
                <h3>屏蔽词</h3>
                <div class="inline-form">
                  <input id="blocked-keyword" placeholder="关键词" />
                  <button class="btn btn-primary btn-sm" id="add-blocked" type="button">添加</button>
                  <button class="btn btn-danger btn-sm" id="delete-blocked" type="button">删除</button>
                </div>
                <button class="btn btn-ghost btn-sm" id="load-blocked" type="button">加载屏蔽词</button>
              </section>
            </div>
            <section class="card">
              <h3>操作结果</h3>
              <pre class="raw-output" id="manager-output">暂无数据</pre>
            </section>
          </section>
        </section>
      </div>
    </main>

    <div class="toast-region" id="toasts" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
